name: Hack My Website
description: Automated web-application security scanner that runs 200+ checks across DAST (OWASP ZAP),
  CVE exploit templates (Nuclei), static analysis (Semgrep/SAST), and SaaS-misconfiguration checks, producing
  a 0-100 AI Launch Score with go/no-go readiness bands and 1-click AI remediation fix prompts for Cursor,
  Claude Code, and Windsurf. Built by Aivi Labs for teams shipping sites made with AI coding tools (Lovable,
  Bolt, v0, Cursor, Claude Code); currently early-access/waitlist with no public developer API.
